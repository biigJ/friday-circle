<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wolfgang Grope Art</title>
    <meta name="description" content="Wolfgang Grope — Katalog 1955–2005. Ölmalerei, Radierungen, Zeichnungen, Keramiken." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="wolfganggrope.css" />
  </head>
  <body class="wga-page de">
    <header class="nav wga-nav" aria-label="Wolfgang Grope Art">
      <div class="nav__inner">
        <a href="wolfganggrope.html" class="nav__logo" aria-label="Wolfgang Grope Art Startseite">WOLFGANG GROPE ART</a>
        <div class="nav__cta-bucket">
          <button type="button" class="wga-nav__bio" id="wga-bio-open" aria-haspopup="dialog" aria-controls="wga-bio">bio</button>
          <div class="nav__lang" role="group" aria-label="Sprache">
            <button type="button" class="is-active" data-fc-lang="de">DE</button>
            <button type="button" data-fc-lang="en">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="wga-hero" aria-labelledby="wga-hero-headline">
        <div class="wga-hero__bleed">
          <div class="wga-hero__slider" aria-hidden="false">
            <div class="wga-hero__track" id="wga-hero-track">
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Gemaelde-1976-1991-30.jpg" alt="Wolfgang Grope — Gemälde 1976–1991" width="1600" height="1000" decoding="async" fetchpriority="high" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Aquarell-1955-1970-03.jpg" alt="Wolfgang Grope — Aquarell 1955–1970" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Gemaelde-2002-04.jpg" alt="Wolfgang Grope — Gemälde 2002" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Keramik-01.jpg" alt="Wolfgang Grope — Keramik" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Gemaelde-2002-13.jpg" alt="Wolfgang Grope — Gemälde 2002" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Grafik-1972-1974-13.jpg" alt="Wolfgang Grope — Radierung 1972–1974" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Grafik-1972-1974-39.jpg" alt="Wolfgang Grope — Radierung 1972–1974" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Grafik-1972-1974-56.jpg" alt="Wolfgang Grope — Radierung 1972–1974" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Grafik-1975-1979-16.jpg" alt="Wolfgang Grope — Radierung 1975–1979" width="1600" height="1000" decoding="async" loading="lazy" /></div>
              <div class="wga-hero__slide"><img src="assets/wolfgang-grope/WG-Keramik-25.jpg" alt="Wolfgang Grope — Keramik" width="1600" height="1000" decoding="async" loading="lazy" /></div>
            </div>
            <div class="wga-hero__dots" id="wga-hero-dots"></div>
          </div>
          <h1 id="wga-hero-headline" class="wga-hero__headline">1955 - 2005</h1>
        </div>
      </section>

      <div class="wga-catalog" id="wga-catalog-root" aria-label="Werkkatalog"></div>
    </main>

    <div id="wga-popup" class="wga-popup" role="dialog" aria-modal="true" aria-labelledby="wga-popup-title" hidden>
      <div class="wga-popup__backdrop" data-wga-popup-close></div>
      <div class="wga-popup__panel">
        <div class="wga-popup__frame">
          <button type="button" class="wga-popup__close" data-wga-popup-close aria-label="Schließen">×</button>
          <div class="wga-slider">
            <div class="wga-slider__track" id="wga-popup-track"></div>
            <div class="wga-slider__dots" id="wga-popup-dots"></div>
          </div>
          <div class="wga-popup__caption">
            <h2 id="wga-popup-title" class="wga-popup__title"></h2>
          </div>
        </div>
        <p id="wga-popup-meta" class="wga-popup__meta" hidden></p>
        <p id="wga-popup-price" class="wga-popup__price" hidden></p>
        <p id="wga-popup-body" class="wga-popup__body" hidden></p>
      </div>
    </div>

    <div id="wga-bio" class="wga-bio" role="dialog" aria-modal="true" aria-labelledby="wga-bio-title" hidden>
      <div class="wga-bio__backdrop" data-wga-bio-close></div>
      <div class="wga-bio__panel">
        <button type="button" class="wga-bio__close" data-wga-bio-close aria-label="Schließen">×</button>
        <h2 id="wga-bio-title" class="wga-bio__title">Lebensdaten</h2>
        <pre class="wga-bio__text" id="wga-bio-text"></pre>
      </div>
    </div>

    <div id="fc-site-footer"></div>
    <script src="data/wga-catalog.js"></script>
    <script src="data/wga-bio.js"></script>
    <script src="nav.js" defer></script>
    <script src="wolfganggrope.js" defer></script>
  </body>
</html>
