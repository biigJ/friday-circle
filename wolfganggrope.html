<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WOLFGANG GROPE KUNSTWERKE</title>
    <meta name="description" content="Wolfgang Grope — Katalog 1955–2005. Ölmalerei, Radierungen, Zeichnungen, Keramiken." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="wolfganggrope.css" />
  </head>
  <body class="wga-page de">
    <header class="nav wga-nav" aria-label="Wolfgang Grope Kunstwerke">
      <div class="nav__inner">
        <div class="wga-nav__leading">
          <a href="wolfganggrope.html" class="nav__logo" aria-label="Wolfgang Grope Kunstwerke Startseite"><span class="de-t">WOLFGANG GROPE KUNSTWERKE</span><span class="en-t">WOLFGANG GROPE ART WORKS</span></a>
          <div class="wga-nav__menu">
            <div class="wga-nav__chapters" id="wga-chapters-nav" hidden>
              <button
                type="button"
                class="wga-nav__chapters-btn wga-nav__text-btn"
                id="wga-chapters-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="wga-chapters-menu"
              >
                <span class="de-t">KAPITEL</span><span class="en-t">CHAPTERS</span>
                <span class="wga-nav__chapters-chevron" aria-hidden="true">▾</span>
              </button>
              <ul class="wga-nav__chapters-menu" id="wga-chapters-menu" role="listbox" hidden></ul>
            </div>
            <button type="button" class="wga-nav__bio wga-nav__text-btn" id="wga-bio-open" aria-haspopup="dialog" aria-controls="wga-bio"><span class="de-t">LEBENSLAUF</span><span class="en-t">CV</span></button>
          </div>
        </div>
        <div class="nav__lang" role="group" aria-label="Sprache">
          <button type="button" class="is-active" data-fc-lang="de">DE</button>
          <button type="button" data-fc-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <section class="wga-hero" aria-labelledby="wga-hero-headline">
        <div class="wga-hero__bleed">
          <div class="wga-hero__slider" aria-hidden="false">
            <div class="wga-hero__track" id="wga-hero-track"></div>
            <div class="wga-hero__dots" id="wga-hero-dots"></div>
          </div>
          <div class="wga-hero__footer">
            <p class="wga-hero__caption" id="wga-hero-caption" aria-live="polite"></p>
            <div class="wga-hero__arrows" id="wga-hero-arrows">
              <button type="button" class="wga-hero__arrow wga-hero__arrow--prev" id="wga-hero-prev" aria-label="Vorheriges Bild"><span aria-hidden="true">‹</span></button>
              <button type="button" class="wga-hero__arrow wga-hero__arrow--next" id="wga-hero-next" aria-label="Nächstes Bild"><span aria-hidden="true">›</span></button>
            </div>
          </div>
          <h1 id="wga-hero-headline" class="wga-hero__headline">1955 - 2005</h1>
        </div>
      </section>

      <div class="wga-catalog" id="wga-catalog-root" aria-label="Werkkatalog"></div>
    </main>

    <div id="wga-popup" class="wga-popup" role="dialog" aria-modal="true" aria-labelledby="wga-popup-title" hidden>
      <div class="wga-popup__backdrop" data-wga-popup-close></div>
      <div class="wga-popup__panel">
        <div class="wga-popup__frame">
          <button type="button" class="wga-popup__close" data-wga-popup-close aria-label="Schließen">×</button>
          <div class="wga-slider">
            <div class="wga-slider__track" id="wga-popup-track"></div>
            <div class="wga-slider__dots" id="wga-popup-dots"></div>
          </div>
          <div class="wga-popup__nav" id="wga-popup-nav">
            <button type="button" class="wga-popup__arrow wga-popup__arrow--prev" id="wga-popup-prev" aria-label="Vorheriges Werk"><span aria-hidden="true">‹</span></button>
            <button type="button" class="wga-popup__arrow wga-popup__arrow--next" id="wga-popup-next" aria-label="Nächstes Werk"><span aria-hidden="true">›</span></button>
          </div>
          <p id="wga-popup-unavailable" class="wga-popup__unavailable" hidden></p>
          <p id="wga-popup-index" class="wga-popup__index"></p>
          <div class="wga-popup__caption" hidden>
            <h2 id="wga-popup-title" class="wga-popup__title"></h2>
          </div>
        </div>
      </div>
    </div>

    <div id="wga-bio" class="wga-bio" role="dialog" aria-modal="true" aria-labelledby="wga-bio-title" hidden>
      <div class="wga-bio__backdrop" data-wga-bio-close></div>
      <div class="wga-bio__panel">
        <button type="button" class="wga-bio__close" data-wga-bio-close aria-label="Schließen">×</button>
        <h2 id="wga-bio-title" class="wga-bio__title">Lebensdaten</h2>
        <pre class="wga-bio__text" id="wga-bio-text"></pre>
      </div>
    </div>

    <div id="fc-site-footer"></div>

    <button type="button" class="wga-scroll-top" id="wga-scroll-top" hidden aria-label="Nach oben">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>

    <script src="data/wga-catalog.js"></script>
    <script src="data/wga-bio.js"></script>
    <script src="fc-swipe-slider.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="wolfganggrope.js" defer></script>
  </body>
</html>
