name: Sync kunst.biig.works

on:
  push:
    branches: [main]
    paths:
      - "biig-interior/kunst/**"
      - "wolfganggrope.html"
      - "wolfganggrope.css"
      - "wolfganggrope.js"
      - "data/wga-catalog.js"
      - "data/wga-bio.js"
      - "data/wga-catalog.json"
      - "styles.css"
      - "fc-lang.js"
      - "assets/wolfgang-grope/**"
      - "scripts/build-biig-kunst.sh"
      - "scripts/deploy-biig-kunst.sh"
      - "scripts/lib/**"
      - ".github/workflows/sync-biig-kunst.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: biigJ/biig-kunst
          token: ${{ secrets.BIIG_KUNST_DEPLOY_TOKEN }}
          path: biig-kunst

      - name: Build and push export
        env:
          KUNST_OUT: ${{ github.workspace }}/biig-kunst
        run: |
          bash scripts/build-biig-kunst.sh
          cd biig-kunst
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No kunst.biig.works changes"
            exit 0
          fi
          git commit -m "Sync from friday-circle@${GITHUB_SHA:0:7}"
          git push
