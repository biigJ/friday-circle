name: Sync gogogo.social

on:
  push:
    branches: [main]
    paths:
      - "gogogo-landing.html"
      - "gogogo.html"
      - "register.html"
      - "gogogo-*.js"
      - "gogogo-i18n-entries.js"
      - "register-i18n-entries.js"
      - "register-accountability/**"
      - "register-training/**"
      - "start/**"
      - "cycle-training.html"
      - "cycle-table.html"
      - "cycle-cards.js"
      - "cycle-table.js"
      - "gogogo-quiz.html"
      - "joschaalstrainer.html"
      - "joschaalscoach.html"
      - "program-landing.css"
      - "styles.css"
      - "fc-lang.js"
      - "fc-i18n.js"
      - "fc-swipe-slider.js"
      - "fc-image-url.js"
      - "assets/gogogo/**"
      - "assets/biigJ/**"
      - "scripts/build-gogogo-social.sh"
      - "scripts/deploy-gogogo-social.sh"
      - "scripts/lib/**"
      - ".github/workflows/sync-gogogo-social.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout friday-circle
        uses: actions/checkout@v4

      - name: Clone gogogo-social
        run: git clone --depth 1 https://github.com/biigJ/gogogo-social.git gogogo-social

      - name: Build and push export
        env:
          GOGOGO_OUT: ${{ github.workspace }}/gogogo-social
          GOGOGO_SOCIAL_DEPLOY_TOKEN: ${{ secrets.GOGOGO_SOCIAL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GOGOGO_SOCIAL_DEPLOY_TOKEN" ]; then
            echo "::error::Secret GOGOGO_SOCIAL_DEPLOY_TOKEN is not set."
            echo "Add a fine-grained PAT (contents: read+write on biigJ/gogogo-social) under"
            echo "Repository Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          bash scripts/build-gogogo-social.sh
          cd gogogo-social
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No gogogo.social changes"
            exit 0
          fi
          git commit -m "Sync from friday-circle@${GITHUB_SHA:0:7}"
          git push "https://x-access-token:${GOGOGO_SOCIAL_DEPLOY_TOKEN}@github.com/biigJ/gogogo-social.git" HEAD:main
