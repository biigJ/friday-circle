name: Sync biig.works

on:
  push:
    branches: [main]
    paths:
      - "biig-interior/**"
      - "wolfganggrope.html"
      - "wolfganggrope.css"
      - "wolfganggrope.js"
      - "data/wga-catalog.js"
      - "data/wga-bio.js"
      - "data/wga-catalog.json"
      - "styles.css"
      - "fc-lang.js"
      - "fc-swipe-slider.js"
      - "fc-image-url.js"
      - "assets/interior/**"
      - "assets/hochbau/**"
      - "assets/biigJ/**"
      - "assets/wolfgang-grope/**"
      - "assets/audio/**"
      - "scripts/build-biig-works.sh"
      - "scripts/deploy-biig-works.sh"
      - "scripts/lib/**"
      - ".github/workflows/sync-biig-works.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout friday-circle
        uses: actions/checkout@v4

      - name: Clone biig-works
        run: git clone --depth 1 https://github.com/biigJ/biig-works.git biig-works

      - name: Build and push export
        env:
          BIIG_OUT: ${{ github.workspace }}/biig-works
          BIIG_WORKS_DEPLOY_TOKEN: ${{ secrets.BIIG_WORKS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$BIIG_WORKS_DEPLOY_TOKEN" ]; then
            echo "::error::Secret BIIG_WORKS_DEPLOY_TOKEN is not set."
            echo "Add a fine-grained PAT (contents: read+write on biigJ/biig-works) under"
            echo "Repository Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          bash scripts/build-biig-works.sh
          cd biig-works
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No biig.works changes"
            exit 0
          fi
          git commit -m "Sync from friday-circle@${GITHUB_SHA:0:7}"
          git push "https://x-access-token:${BIIG_WORKS_DEPLOY_TOKEN}@github.com/biigJ/biig-works.git" HEAD:main
