name: Sync biig.works

on:
  push:
    branches: [main]
    paths:
      - "biig-interior/**"
      - "wolfganggrope.html"
      - "wolfganggrope.css"
      - "wolfganggrope.js"
      - "data/wga-catalog.js"
      - "data/wga-bio.js"
      - "data/wga-catalog.json"
      - "styles.css"
      - "fc-lang.js"
      - "fc-swipe-slider.js"
      - "fc-image-url.js"
      - "assets/interior/**"
      - "assets/hochbau/**"
      - "assets/biigJ/**"
      - "assets/wolfgang-grope/**"
      - "assets/audio/**"
      - "scripts/build-biig-works.sh"
      - "scripts/deploy-biig-works.sh"
      - "scripts/lib/**"
      - ".github/workflows/sync-biig-works.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout friday-circle
        uses: actions/checkout@v4

      - name: Checkout biig-works
        uses: actions/checkout@v4
        with:
          repository: biigJ/biig-works
          token: ${{ secrets.BIIG_WORKS_DEPLOY_TOKEN }}
          path: biig-works

      - name: Build and push export
        env:
          BIIG_OUT: ${{ github.workspace }}/biig-works
        run: |
          bash scripts/build-biig-works.sh
          cd biig-works
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No biig.works changes"
            exit 0
          fi
          git commit -m "Sync from friday-circle@${GITHUB_SHA:0:7}"
          git push
